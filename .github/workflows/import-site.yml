name: Import approved Jeanie Calder website
on:
  push:
    branches: [main]
    paths: ['.github/site-import.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initial-site-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'EthanSharpNZ/jeanie-calder-website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and unpack approved encrypted snapshot
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, tempfile, urllib.parse, urllib.request
          root = pathlib.Path.cwd()
          cfg_path = root / '.github/site-import.json'
          if not cfg_path.exists():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('imported=false\n')
              print('No pending import.')
              raise SystemExit(0)
          if (root / 'package.json').exists(): raise SystemExit('Refusing to overwrite an existing website.')
          allowed = {'README.md', '.github/workflows/import-site.yml', '.github/site-import.json', ''}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          if any(p not in allowed for p in tracked): raise SystemExit('Unexpected existing files; review required.')
          cfg = json.loads(cfg_path.read_text())
          url, password = cfg['url'], cfg['transfer_password']
          print('::add-mask::' + url)
          print('::add-mask::' + password)
          parsed = urllib.parse.urlsplit(url)
          host = parsed.hostname or ''
          if parsed.scheme != 'https' or not host.endswith('.trycloudflare.com'): raise SystemExit('Unexpected transfer host.')
          if cfg['source_commit'] != '50a5da0664286ca206ee5f2e56652c948999ba3f': raise SystemExit('Unexpected source revision.')
          with tempfile.TemporaryDirectory(prefix='site-import-') as directory:
              tmp = pathlib.Path(directory)
              encrypted, archive = tmp / 'snapshot.enc', tmp / 'snapshot.tar.gz'
              with urllib.request.urlopen(url, timeout=90) as response: data = response.read(25000001)
              if len(data) != cfg['encrypted_bytes'] or len(data) > 25000000: raise SystemExit('Unexpected transfer size.')
              if hashlib.sha256(data).hexdigest() != cfg['encrypted_sha256']: raise SystemExit('Ciphertext checksum mismatch.')
              encrypted.write_bytes(data)
              subprocess.run(['openssl', 'enc', '-d', '-aes-256-cbc', '-pbkdf2', '-iter', '200000', '-md', 'sha256', '-pass', 'env:SITE_TRANSFER_PASSWORD', '-in', str(encrypted), '-out', str(archive)], env=dict(os.environ, SITE_TRANSFER_PASSWORD=password), check=True)
              if hashlib.sha256(archive.read_bytes()).hexdigest() != cfg['archive_sha256']: raise SystemExit('Archive checksum mismatch.')
              source = tmp / 'source'
              source.mkdir()
              excluded = {'.mov', '.mp4', '.pdf', '.zip', '.woff', '.woff2', '.ttf', '.otf'}
              with tarfile.open(archive, 'r:gz') as tar:
                  members = tar.getmembers()
                  if len(members) > 1000 or sum(m.size for m in members) > 50000000: raise SystemExit('Unexpected archive size.')
                  for m in members:
                      p = pathlib.PurePosixPath(m.name)
                      if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()): raise SystemExit('Unsafe archive entry.')
                      if set(p.parts) & {'.git', '.github', 'node_modules', 'dist'}: raise SystemExit('Excluded archive directory.')
                      if p.name == '.env' or p.name.startswith('.env.') or p.suffix.lower() in excluded: raise SystemExit('Excluded archive file.')
                  tar.extractall(source, members=members, filter='data')
              files = sorted(p for p in source.rglob('*') if p.is_file())
              manifest = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(source).as_posix() + '\n' for p in files)
              if len(files) != cfg['file_count'] or hashlib.sha256(manifest.encode()).hexdigest() != cfg['manifest_sha256']: raise SystemExit('Source manifest mismatch.')
              required = ['package.json', 'package-lock.json', '.npmrc', '.nvmrc', 'vite.static.config.ts', 'static.html', 'src/assets/jeanie-calder-front-cover.webp', 'src/assets/morpho-menelaus.webp', 'src/components/author-website.tsx', 'src/components/hero-butterfly.tsx', 'src/assets/butterfly-sequence/manifest.json', 'src/assets/butterfly-sequence/butterfly-poster.webp']
              required += [f'src/assets/butterfly-sequence/butterfly-atlas-{i}.webp' for i in range(6)]
              if any(not (source / p).is_file() for p in required): raise SystemExit('Required website file missing.')
              for p in files:
                  target = root / p.relative_to(source)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(p.read_bytes())
                  target.chmod(p.stat().st_mode & 0o777)
              (root / 'SOURCE_IMPORT.md').write_text('# Website source import\n\nSource project: `eec0f302-f635-43cf-9f8f-c55e914912fe`\nSource commit: `' + cfg['source_commit'] + '`\nSource file count: ' + str(cfg['file_count']) + '\nManifest SHA-256: `' + cfg['manifest_sha256'] + '`\n\nFiles and nine approved WebP assets were verified byte-for-byte. No account credentials, original MOV, publisher PDF, font binaries or chat history are included. This is a separate GitHub copy, not an automatic Lovable sync. The initial README remains in Git history.\n\n## Verified imported files\n\n```text\n' + manifest + '```\n')
          cfg_path.unlink()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('imported=true\n')
          print('Approved source verified and unpacked.')
          PY
      - uses: actions/setup-node@v4
        if: steps.unpack.outputs.imported == 'true'
        with:
          node-version: '22'
      - name: Clean install, tests and production build
        if: steps.unpack.outputs.imported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          if grep -R -l -E 'id-preview--|/__l5e/assets-v1/' dist; then exit 1; fi
      - name: Commit verified website
        if: steps.unpack.outputs.imported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config credential.helper '!gh auth git-credential'
          expected="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '(^|/)(node_modules|dist|\.env)(/|$)|\.(mov|mp4|pdf|zip|woff2?|ttf|otf)$'; then exit 1; fi
          git commit -m 'Import approved Jeanie Calder website with verified local assets'
          git push origin HEAD:main
          printf '## Website import complete\n\nCommit: `%s`\n\nClean install, tests and static production build passed.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
